[project]
name = "billing-app"
version = "0.1.0"
description = "AWSの使用料金をDiscordに通知するLambda"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "boto3",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["notify_billing"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
