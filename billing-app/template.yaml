AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Notify Discord every month 1st of AWS billing

Globals:
  Function:
    Timeout: 25
    MemorySize: 128

Parameters:
  DiscordWebhookUrl:
    Type: String
    NoEcho: true
    Description: Discord の Webhook URL(必須)
  ChangeRateUrl:
    Type: String
    NoEcho: true
    Default: ""
    Description: ドル円為替レートを返す API の URL(空の場合は USD のみで通知)

Resources:
  NotifyBillingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/notify-billing-function
      RetentionInDays: 90

  BillingIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: "NotifyBillingLambdaPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: !Sub "${NotifyBillingLogGroup.Arn}:*"
              # Cost Explorer はリソース単位の指定ができない
              - Effect: Allow
                Action:
                  - "ce:GetCostAndUsage"
                Resource: "*"

  NotifyBillingInfo:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: notify-billing-function
      CodeUri: notify_billing/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
      - arm64
      LoggingConfig:
        LogGroup: !Ref NotifyBillingLogGroup
      Environment:
        Variables:
          DISCORD_WEBHOOK_URL: !Ref DiscordWebhookUrl
          EXCHANGE_RATE_URL: !Ref ChangeRateUrl
      Role: !GetAtt BillingIamRole.Arn
      Events:
        NotifyBillingSchedule:
          Type: ScheduleV2
          Properties:
            Name: NotificationBillingSchedule
            ScheduleExpression: cron(0 21 1 * ? *) # 毎月1日 21時
            Description: 毎月1日に通知
            ScheduleExpressionTimezone: "Asia/Tokyo"
